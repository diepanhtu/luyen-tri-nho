<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Trí Nhớ - Luyện Nhị Phân</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --font-heading: 'Be Vietnam Pro', 'Inter', sans-serif;
            --font-body: 'Be Vietnam Pro', 'Inter', sans-serif;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --bg-surface: rgba(30, 41, 59, 0.7);
            --bg-surface-solid: #1e293b;
            --border-color: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(129, 140, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #10b981;
            --accent-hover: #059669;
            --radius-md: 14px;
            --radius-full: 9999px;
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header & Tabs */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .brand-text h1 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .brand-text span {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.65rem 1.25rem;
            font-family: var(--font-body);
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition-speed);
            background: var(--bg-surface);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--bg-surface-solid);
            border-color: var(--border-highlight);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
            border: none;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-accent:hover {
            background: var(--accent-hover);
        }

        /* Tabs container strictly 1 horizontal row */
        .tabs {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE / Edge */
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: var(--radius-full);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex: 1;
            text-align: center;
            max-width: 180px;
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Main Display */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .binary-display {
            font-family: monospace;
            font-size: clamp(3.5rem, 14vw, 8rem);
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-main);
            text-shadow: 0 10px 30px var(--primary-glow);
            margin-bottom: 1rem;
            text-align: center;
        }

        .binary-display span {
            display: inline-block;
            margin: 0 0.5rem;
        }

        .answer-area {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            width: max-content;
        }

        .answer-area.show {
            opacity: 1;
            visibility: visible;
        }

        .answer-main {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            color: var(--text-main);
            background: linear-gradient(135deg, var(--text-main) 30%, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .answer-formula {
            font-size: 1.1rem;
            color: var(--text-muted);
            background: var(--bg-surface-solid);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .hint {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 1rem;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 100;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-surface-solid);
            padding: 2rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 400px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.2rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .lookup-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .lookup-item {
            display: flex;
            justify-content: space-between;
            background: var(--bg-surface);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.1rem;
            border: 1px solid var(--border-color);
        }

        .lookup-item strong {
            color: var(--accent);
            font-family: var(--font-heading);
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            .tabs {
                flex-direction: row;
                gap: 0.35rem;
            }

            .tab {
                padding: 0.5rem 0.4rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="brand-text">
                <h1>Siêu Trí Nhớ <span>Nhị Phân</span></h1>
                <p class="tagline">Luyện tập chuyển đổi Binary -> Chữ cái</p>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn">🏠 Về Trang Chủ</a>
                <button id="btn-guide" class="btn btn-primary">📖 Bảng Tra Cứu Mã Hóa</button>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" data-mode="3bit">Chế độ A</div>
            <div class="tab" data-mode="6bit">Chế độ B</div>
            <div class="tab" data-mode="modeC">Chế độ C</div>
            <div class="tab" data-mode="modeD">Chế độ D</div>
        </div>

        <main class="workspace" id="workspace">
            <div class="binary-display" id="question">000</div>

            <div class="answer-area" id="answer-area">
                <div class="answer-main" id="answer-main">C</div>
                <div class="answer-formula" id="answer-formula">000 &rarr; C</div>
            </div>
        </main>

        <div class="action-buttons">
            <button id="btn-show-answer" class="btn btn-accent">Hiện Đáp Án</button>
        </div>

        <div class="hint">Chạm vào màn hình hoặc bấm phím Space/Enter để sang số tiếp theo</div>
    </div>

    <!-- Modal Tra Cứu -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Bảng Quy Đổi 3-Bit</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="lookup-grid" id="lookup-grid">
                <!-- Javascript will populate this -->
            </div>
        </div>
    </div>

    <script>
        // 1. Data Mapping
        const BIT_MAP = {
            "000": "C", "001": "T", "011": "N", "111": "M",
            "110": "R", "100": "S", "010": "B", "101": "P"
        };
        const BIT_KEYS = Object.keys(BIT_MAP);

        const IMG_MAP = {
            "00": "Con Chó", "01": "Con Trâu", "02": "Con Nhím", "03": "Con Mực", "04": "Con Rắn", "05": "Cá Sấu", "06": "Cái Búa", "07": "Cục Phấn", "08": "Con Heo", "09": "Con Gián",
            "10": "Tổ Chim", "11": "Tinh Tinh", "12": "Tấm Nệm", "13": "Thang Máy", "14": "Túi Rác", "15": "Thùng Sơn", "16": "Túi Balo", "17": "Tai Phone", "18": "Tàu Hỏa", "19": "Tê Giác",
            "20": "Nước Cất", "21": "Nhà Tù", "22": "Người Nhện", "23": "Nước Mắm", "24": "Nấm Rơm", "25": "Nhân Sâm", "26": "Nhẫn Bạc", "27": "Nổ Pháo", "28": "Nghiện Hút", "29": "Người Già",
            "30": "Móng Chân", "31": "Máy Tính", "32": "Màng Nhĩ", "33": "Móc Mắt", "34": "Mưa Rào", "35": "Móc Sắt", "36": "Máy Bay", "37": "MAFIA", "38": "Màn Hình", "39": "Máy Giặt",
            "40": "Răng Cưa", "41": "Rổ Tre", "42": "Ruột Non", "43": "Rắc Muối", "44": "Ròng Rọc", "45": "Rồng Sắt", "46": "Robot", "47": "Rô Phi", "48": "Rau Hẹ", "49": "Rô Ga",
            "50": "Sữa Chua", "51": "Sư Tử", "52": "Sọ Người", "53": "Sứt Môi", "54": "Sầu Riêng", "55": "Su Su", "56": "Sóng Biển", "57": "Sạc Pin", "58": "Su Hào", "59": "Sàn Gỗ",
            "60": "Bọ Cạp", "61": "Bong Tai", "62": "Bắp Ngô", "63": "Bóng Ma", "64": "Bóng Rổ", "65": "Bác Sĩ", "66": "Bong Bóng", "67": "Bàn Phím", "68": "Bác Hồ", "69": "Bình Ga",
            "70": "Phi Công", "71": "Phù Thủy", "72": "Phá Nhà", "73": "Phát Minh", "74": "Phấn Rôm", "75": "Pháp Sư", "76": "Phong Bì", "77": "Phật Pháp", "78": "Phóng Hỏa", "79": "Phân Gà",
            "80": "Hươu Cao Cổ", "81": "Hành Tây", "82": "Hạt Nêm", "83": "Học Máu", "84": "Hàng Rào", "85": "Hố Sâu", "86": "Hoàng Bào", "87": "Hoa Phượng", "88": "Hôi Hám", "89": "Hạt Gạo",
            "90": "Gà Chọi", "91": "Găng Tay", "92": "Gậy Như Ý", "93": "Giun Móc", "94": "Giấy Ráp", "95": "Ghế Sofa", "96": "Gió Bão", "97": "Giải Phóng", "98": "Ghi Hình", "99": "Ga Giường"
        };

        const NUM_MAP = {
            "C": "0", "T": "1", "N": "2", "M": "3", "R": "4", "S": "5", "B": "6", "P": "7"
        };

        // 2. State
        let currentMode = "3bit";
        let isAnswerShown = false;
        let currentQuestion = null;

        // 3. Elements
        const workspace = document.getElementById("workspace");
        const questionEl = document.getElementById("question");
        const answerArea = document.getElementById("answer-area");
        const answerMain = document.getElementById("answer-main");
        const answerFormula = document.getElementById("answer-formula");
        const btnShowAnswer = document.getElementById("btn-show-answer");
        const tabs = document.querySelectorAll(".tab");

        // 4. Logic
        function getRandomBits() {
            return BIT_KEYS[Math.floor(Math.random() * BIT_KEYS.length)];
        }

        function generateQuestion() {
            isAnswerShown = false;
            answerArea.classList.remove("show");
            btnShowAnswer.textContent = "Hiện Đáp Án";

            if (currentMode === "3bit") {
                const bits = getRandomBits();
                currentQuestion = { type: "3bit", bits };
                questionEl.innerHTML = bits;
            } else if (currentMode === "6bit") {
                const bit1 = getRandomBits();
                const bit2 = getRandomBits();
                currentQuestion = { type: "6bit", bit1, bit2 };
                questionEl.innerHTML = `<span>${bit1}</span><span>${bit2}</span>`;
            } else if (currentMode === "modeC") {
                currentQuestion = { type: "modeC" };
                questionEl.innerHTML = "Chế độ C";
            } else if (currentMode === "modeD") {
                currentQuestion = { type: "modeD" };
                questionEl.innerHTML = "Chế độ D";
            }
        }

        function toggleShowAnswer() {
            isAnswerShown = !isAnswerShown;
            if (isAnswerShown) {
                answerArea.classList.add("show");
                btnShowAnswer.textContent = "Ẩn Đáp Án";

                if (currentQuestion.type === "3bit") {
                    const letter = BIT_MAP[currentQuestion.bits];
                    answerMain.innerHTML = letter;
                    answerFormula.innerHTML = `${currentQuestion.bits} &rarr; ${letter}`;
                } else if (currentQuestion.type === "6bit") {
                    const letter1 = BIT_MAP[currentQuestion.bit1];
                    const letter2 = BIT_MAP[currentQuestion.bit2];
                    const combined = letter1 + letter2;
                    const digit1 = NUM_MAP[letter1];
                    const digit2 = NUM_MAP[letter2];
                    const numString = digit1 + digit2;
                    const image = IMG_MAP[numString] || "???";

                    answerMain.innerHTML = `${combined} - ${image}`;
                    answerFormula.innerHTML = `${currentQuestion.bit1} (${letter1}) + ${currentQuestion.bit2} (${letter2}) &rarr; ${combined} &rarr; ${image}`;
                } else {
                    answerMain.innerHTML = "Chế độ " + (currentQuestion.type === "modeC" ? "C" : "D");
                    answerFormula.innerHTML = "Đang phát triển tính năng";
                }
            } else {
                answerArea.classList.remove("show");
                btnShowAnswer.textContent = "Hiện Đáp Án";
            }
        }

        function setMode(mode) {
            currentMode = mode;
            tabs.forEach(t => {
                t.classList.toggle("active", t.dataset.mode === mode);
            });
            generateQuestion();
        }

        // 5. Events
        workspace.addEventListener("click", generateQuestion);

        document.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                generateQuestion();
            }
        });

        btnShowAnswer.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleShowAnswer();
        });

        tabs.forEach(tab => {
            tab.addEventListener("click", () => setMode(tab.dataset.mode));
        });

        // Modal Setup
        const lookupGrid = document.getElementById("lookup-grid");
        BIT_KEYS.forEach(bits => {
            const div = document.createElement("div");
            div.className = "lookup-item";
            div.innerHTML = `<span>${bits}</span> <strong>${BIT_MAP[bits]}</strong>`;
            lookupGrid.appendChild(div);
        });

        const modal = document.getElementById("modal");
        document.getElementById("btn-guide").addEventListener("click", () => modal.classList.add("active"));
        document.getElementById("close-modal").addEventListener("click", () => modal.classList.remove("active"));
        modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.classList.remove("active");
        });

        // Initialize
        generateQuestion();
    </script>
</body>

</html>
